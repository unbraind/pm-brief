name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs; manual runs stay independent.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Required checks stay on fast GitHub-hosted hardware.
    runs-on: ubuntu-latest
    # Bound quick-tier work and hung subprocesses on hosted slots.
    timeout-minutes: 25
    env:
      PM_TEST_DEPTH: quick
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in `engines` and the first line that strips
        # TypeScript without a flag; 26 is what the fleet develops against.
        node-version: [22, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Checkout must precede this first decision. NUL delimiters handle unusual
      # filenames; compare the actual PR endpoints, not the synthetic merge commit.
      # Disable rename folding so moving source into docs still counts its deletion.
      - name: Detect code changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          code=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            code=false
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                # Executable tracker files use the same code tier in every package.
                .agents/pm/*.mjs|.agents/pm/*.cjs|.agents/pm/*.js|.agents/pm/*.ts) code=true ;;
                .agents/pm/*|*.md|docs/*|CHANGELOG.md|LICENSE) ;;
                *) code=true ;;
              esac
            done < "$RUNNER_TEMP/ci-changed-paths"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        if: steps.changes.outputs.code == 'true' || matrix.node-version == 26
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Verify tracked pm project health
        if: steps.changes.outputs.code != 'true' || matrix.node-version == 26
        shell: bash
        run: |
          set -euo pipefail
          # Catch durable checkout-visible failures: conflict markers, parse failures,
          # invalid or drifted history, tracked runtime caches, extension health,
          # stale in-progress work, and any merge evidence present in this clone.
          #
          # This is not a lossless-merge attestation. Merge receipts are clone-local and
          # absent from a fresh CI checkout. Some unreconciled loss shapes surface as
          # history drift, but reconciliation or history repair can remove that signal.
          # Keep receipt review as a local pre-push step; pm-cli#921 and pm-cli#922 track
          # the missing durable proof.
          #
          # `--strict-exit` is load-bearing: non-strict health may report findings while
          # still exiting successfully.
          ./node_modules/.bin/pm health --strict-exit --require-merge-drivers

      # No standalone markdown linter exists. These small suites enforce the
      # existing README/example, package metadata and public commit contracts.
      - name: Check documentation and tracker changes
        if: steps.changes.outputs.code != 'true'
        run: |
          npm run changelog:check
          npm run build
          node --test test/packaging.test.ts test/package-metadata.test.ts test/identity-audit.test.ts
          npm pack --dry-run --ignore-scripts

      - name: Accept packed documentation changes
        if: steps.changes.outputs.code != 'true' && matrix.node-version == 26
        run: npm run accept:packed

      - name: Engines floor tests
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 22
        run: npm test

      - name: Quick npm release gate
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: npm run release:check

      # Packed acceptance already covers Bun project/global installs and bunx.
      - name: Verify Bun can install the package graph
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: bun install --no-save

  # The production audit script is the one place in this package that has to
  # behave differently per platform: it strips npm_config_allow_scripts from the
  # environment and, on Windows, must spawn npm through a shell because Node
  # refuses to execute .cmd files via spawn otherwise. Two separate Windows-only
  # breakages shipped here undetected because CI was ubuntu-only, so the script
  # gets a Windows job of its own rather than a caveat in the commit message.
  audit-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PM_TEST_DEPTH: quick
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Detect code changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          code=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            code=false
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                # Executable tracker files use the same code tier in every package.
                .agents/pm/*.mjs|.agents/pm/*.cjs|.agents/pm/*.js|.agents/pm/*.ts) code=true ;;
                .agents/pm/*|*.md|docs/*|CHANGELOG.md|LICENSE) ;;
                *) code=true ;;
              esac
            done < "$RUNNER_TEMP/ci-changed-paths"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        if: steps.changes.outputs.code == 'true'
        run: npm run audit:prod

      - name: Production dependency audit with npm_config_allow_scripts set
        if: steps.changes.outputs.code == 'true'
        # The exact condition the script exists to survive: a bare
        # `npm audit --omit=dev` aborts with EALLOWSCRIPTS when this is present.
        env:
          npm_config_allow_scripts: "true"
        run: npm run audit:prod

      - name: Check documentation and tracker changes
        if: steps.changes.outputs.code != 'true'
        run: |
          node node_modules/@unbrained/pm-cli/dist/cli.js health --strict-exit --require-merge-drivers
          npm run changelog:check
          node --test test/identity-audit.test.ts
